<title>MORI Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar + content on desktop, bottom tab bar on phone. Cinematic night palette, ember accent. */
:root{
  --bg:#f3f1ee; --panel:#ffffff; --panel2:#ece9e5; --line:#dcd7d1;
  --fg:#1b1a1f; --mute:#6b6670; --accent:#c4561a; --accent-fg:#fff; --accent-soft:#f6e1d4;
  --ok:#1f7a4d; --ok-soft:#d9efe3; --warn:#9a6a00; --warn-soft:#f7ebc8; --bad:#b3261e; --bad-soft:#f6d9d6; --info:#2a5fa8; --info-soft:#dbe6f6;
  --f-display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0e13; --panel:#17171e; --panel2:#1f1f28; --line:#2b2b36;
  --fg:#ecebf0; --mute:#9a97a6; --accent:#f0954f; --accent-fg:#1a0e05; --accent-soft:#3a2417;
  --ok:#5fd29a; --ok-soft:#14301f; --warn:#e8bd5a; --warn-soft:#3a2f10; --bad:#ff8a80; --bad-soft:#3d1a18; --info:#8ab4f0; --info-soft:#18273f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e13; --panel:#17171e; --panel2:#1f1f28; --line:#2b2b36;
  --fg:#ecebf0; --mute:#9a97a6; --accent:#f0954f; --accent-fg:#1a0e05; --accent-soft:#3a2417;
  --ok:#5fd29a; --ok-soft:#14301f; --warn:#e8bd5a; --warn-soft:#3a2f10; --bad:#ff8a80; --bad-soft:#3d1a18; --info:#8ab4f0; --info-soft:#18273f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:700 15px var(--f-display)}
.brand b{font:700 17px var(--f-display);display:block;line-height:1.1}
.brand small{color:var(--mute);font-size:11px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--mute);text-decoration:none;font-weight:500}
nav a:hover{background:var(--panel2);color:var(--fg)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.badge{min-width:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:600;text-align:center;line-height:20px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--mute)}
.sync{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-soft)}
.theme{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--mute)}
main{padding:28px max(24px,env(safe-area-inset-right,0px)) 48px 28px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font:700 28px/1.1 var(--f-display);margin:0;text-wrap:balance}
.sub{color:var(--mute);margin-top:6px}
.demo{font-size:11px;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:99px;font-weight:500}
h2{font:600 16px var(--f-display);margin:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:500;text-decoration:none;color:var(--fg);display:inline-block}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.stat{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.stat span{color:var(--mute);font-size:12.5px}
.stat b{display:block;font:700 28px/1.2 var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.stat small{color:var(--mute);font-size:12px}
.stat.hot{border-color:var(--accent);background:var(--accent-soft)}
.cols{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card .body{padding:6px 16px 10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .grow div:first-child{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mute{color:var(--mute);font-size:12.5px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.off{background:var(--panel2);color:var(--mute)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.time{width:54px;font:500 13px var(--f-mono);color:var(--accent)}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:5px;width:120px}
.bar i{display:block;height:100%;background:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 13px;font-size:13px;color:var(--mute)}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:500;padding:11px 16px;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:12px;background:var(--panel);min-height:210px;padding:10px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent)}
.day h3{margin:0;font:600 12px var(--f-body);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.day h3 b{font:700 18px var(--f-display);color:var(--fg);letter-spacing:0}
.slot{border-radius:8px;padding:8px;background:var(--accent-soft);border-left:3px solid var(--accent);font-size:12.5px}
.slot.b{background:var(--info-soft);border-color:var(--info)}.slot.c{background:var(--ok-soft);border-color:var(--ok)}
.slot b{display:block;font-weight:600;line-height:1.3}
.slot span{color:var(--mute);font-size:11.5px;display:block}
.empty{color:var(--mute);font-size:12px;margin:auto;text-align:center}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px}
.step{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.step b{display:block;font:600 14px var(--f-display);margin:6px 0 4px}
.step p{margin:0;color:var(--mute);font-size:12.5px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--mute)}
.field .in{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;resize:vertical;min-height:64px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw label{display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;justify-content:space-between}
.sw input{width:38px;height:22px;appearance:none;background:var(--panel2);border:1px solid var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:.15s}
.sw input:checked{background:var(--accent);border-color:var(--accent)}
.sw input:checked::after{left:18px;background:var(--accent-fg)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:31;padding:22px max(20px,env(safe-area-inset-right,0px)) 22px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.drawer h2{font-size:20px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
.contact{display:grid;gap:8px}
.crow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2)}
.crow .lbl{width:52px;color:var(--mute);font-size:12px;flex:none}
.crow .val{flex:1;min-width:0;overflow-wrap:anywhere}
.crow.pref{border-color:var(--accent)}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--mute);font-style:italic}
.log{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.log li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:13px}
.log time{color:var(--mute);font-size:12px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--panel2)}
.steps i.on{background:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:500;max-width:90vw}
.tabbar{display:none}
@media (max-width:1080px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}.week{grid-template-columns:repeat(4,minmax(0,1fr))}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{display:block}.side{display:none}
  main{padding:20px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
  h1{font-size:24px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:var(--mute);text-decoration:none;border-radius:8px;position:relative}
  .tabbar a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .tabbar .badge{position:absolute;top:0;right:8px;min-width:16px;line-height:16px;font-size:10px;padding:0 4px}
  .week{grid-template-columns:minmax(0,1fr)}.day{min-height:0}
  .flow{grid-template-columns:minmax(0,1fr)}
  .stat b{font-size:24px}
  .log li{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:0}}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">M</div><div><b>ME.MORI</b><small>Quản lý lớp học</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="sync"><span class="dot"></span><div>Đang nhận đăng ký từ website<br><span class="mono">đăng ký cuối 3 giờ trước</span></div></div>
      <button class="theme" id="theme">Đổi giao diện sáng / tối</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="layer"></div>

<script>
/* ---- Dữ liệu mẫu (chỉ để duyệt giao diện) ---- */
const CLASSES={A:{name:'Storytelling cho video ngắn',price:990000,cap:20,cls:''},B:{name:'Tư duy hình ảnh cinematic',price:1290000,cap:16,cls:'b'},C:{name:'Quay dựng cho creator',price:1490000,cap:12,cls:'c'}};
let SESSIONS=[
 {day:1,t:'19:00–21:30',k:'A',room:'Phòng Lumi, Q.3',taken:17},
 {day:3,t:'19:00–21:30',k:'A',room:'Phòng Lumi, Q.3',taken:17},
 {day:5,t:'09:00–12:00',k:'B',room:'Studio Mori, Q.1',taken:13},
 {day:6,t:'14:00–17:00',k:'C',room:'Studio Mori, Q.1',taken:12},
 {day:6,t:'19:30–21:00',k:'A',room:'Online (Zoom)',taken:6}
];
let REGS=[
 {id:'DK0421',name:'Nguyễn Minh Anh',phone:'0903112458',email:'minhanh@mail.com',k:'B',s:2,at:'Hôm nay 10:42',age:3,pref:'zalo',msg:'Mình mới làm video bằng điện thoại, không biết có theo kịp lớp không ạ?',status:'new',log:[]},
 {id:'DK0420',name:'Trần Quốc Bảo',phone:'0987334120',email:'bao.tq@mail.com',k:'A',s:4,at:'Hôm nay 09:15',age:5,pref:'phone',msg:'Gọi cho mình sau 18h nhé.',status:'new',log:[]},
 {id:'DK0419',name:'Lê Thu Hà',phone:'0912778004',email:'thuha.le@mail.com',k:'C',s:3,at:'Hôm qua 21:08',age:17,pref:'email',msg:'',status:'contacted',log:[{w:'Hôm qua 22:00',t:'Gọi, chưa nghe máy. Đã nhắn Zalo.'},{w:'Hôm nay 08:30',t:'Chị Hà trả lời, đang cân nhắc giữa buổi CN và lớp sau. Hẹn báo lại chiều nay.'}]},
 {id:'DK0418',name:'Phạm Gia Huy',phone:'0366540912',email:'giahuy@mail.com',k:'A',s:1,at:'Hôm qua 16:30',age:20,pref:'zalo',msg:'',status:'confirmed',log:[{w:'Hôm qua 17:10',t:'Tư vấn qua Zalo, bạn chốt học và đã chuyển học phí.'}]},
 {id:'DK0417',name:'Võ Ngọc Trâm',phone:'0935221670',email:'ngoctram@mail.com',k:'B',s:2,at:'11/11 20:12',age:62,pref:'zalo',msg:'Cho mình hỏi lớp có học trải nghiệm thử không?',status:'new',log:[]},
 {id:'DK0416',name:'Đặng Hoàng Long',phone:'0778905331',email:'longdh@mail.com',k:'C',s:3,at:'11/11 11:47',age:70,pref:'phone',msg:'',status:'confirmed',log:[{w:'11/11 13:00',t:'Gọi tư vấn 15 phút, xác nhận học.'}]},
 {id:'DK0415',name:'Bùi Khánh Linh',phone:'0944018276',email:'khanhlinh@mail.com',k:'A',s:0,at:'10/11 14:20',age:100,pref:'email',msg:'',status:'cancelled',log:[{w:'10/11 16:00',t:'Bạn bận lịch, hẹn khóa sau.'}]}
];
const ST={new:['Mới','acc'],contacted:['Đang tư vấn','info'],confirmed:['Đã xác nhận','ok'],cancelled:['Đã hủy','off']};
const PREF={zalo:'Zalo',phone:'Điện thoại',email:'Email'};
const DAYS=['T2','T3','T4','T5','T6','T7','CN'];const DATES=[9,10,11,12,13,14,15];const TODAY=5;
const $=s=>document.querySelector(s);
const pill=s=>`<span class="pill ${ST[s][1]}">${ST[s][0]}</span>`;
const count=s=>REGS.filter(r=>r.status===s).length;
const waited=r=>r.age>=24?`<span class="pill warn">Chờ ${Math.floor(r.age/24)} ngày</span>`:`<span class="mute">${r.age} giờ trước</span>`;
const fmtPhone=p=>p.replace(/(\d{4})(\d{3})(\d{3,4})/,'$1 $2 $3');

/* ---- Điều hướng ---- */
const VIEWS=[['tong-quan','Tổng quan'],['dang-ky','Đăng ký'],['lich','Lịch học'],['ket-noi','Kết nối']];
function navHtml(){const cur=(location.hash||'#tong-quan').slice(1);const n=count('new');
  return VIEWS.map(([h,l])=>`<a href="#${h}" ${h===cur?'aria-current="page"':''}>${l}${h==='dang-ky'&&n?`<span class="badge">${n}</span>`:''}</a>`).join('')}
let filter='all';
function render(){
  const cur=(location.hash||'#tong-quan').slice(1);
  $('#nav').innerHTML=navHtml();$('#tabbar').innerHTML=navHtml();
  const f={'tong-quan':overview,lich:schedule,'dang-ky':regs,'ket-noi':connect}[cur]||overview;
  $('#main').innerHTML=f();
  document.title='MORI Admin';
}
function head(t,s,extra=''){return `<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${extra}<span class="demo">Dữ liệu mẫu</span></div></div>`}
const zalo=r=>`https://zalo.me/${r.phone}`;

/* ---- Tổng quan ---- */
function overview(){
  const todo=REGS.filter(r=>r.status==='new').sort((a,b)=>b.age-a.age);
  const todayS=SESSIONS.filter(s=>s.day===TODAY);
  return head('Tổng quan','Thứ Bảy, 14/11/2026 · tuần 46')+`
  <div class="grid stats">
    <div class="stat ${todo.length?'hot':''}"><span>Chờ bạn liên hệ</span><b>${todo.length}</b><small>đăng ký mới, chưa ai tư vấn</small></div>
    <div class="stat"><span>Đang tư vấn</span><b>${count('contacted')}</b><small>đã liên hệ, chưa chốt</small></div>
    <div class="stat"><span>Đã xác nhận tháng 11</span><b>${count('confirmed')+21}</b><small>học viên chính thức</small></div>
    <div class="stat"><span>Chỗ còn trống tuần này</span><b>${SESSIONS.reduce((a,s)=>a+CLASSES[s.k].cap-s.taken,0)}</b><small>trên ${SESSIONS.length} buổi</small></div>
  </div>
  <div class="grid cols">
    <section class="card"><header><h2>Cần liên hệ</h2><a class="btn sm" href="#dang-ky">Xem tất cả</a></header><div class="body">
      ${todo.map(r=>`<div class="row"><div class="grow" data-reg="${r.id}" style="cursor:pointer"><div>${r.name}</div><div class="mute">${CLASSES[r.k].name} · ưu tiên ${PREF[r.pref]}</div></div>${waited(r)}<button class="btn sm" data-reg="${r.id}">Mở</button></div>`).join('')||'<div class="mute" style="padding:16px 0">Đã liên hệ hết các đăng ký mới.</div>'}
    </div></section>
    <section class="card"><header><h2>Buổi học hôm nay</h2><a class="btn sm" href="#lich">Mở lịch</a></header><div class="body">
      ${todayS.map(s=>`<div class="row"><div class="time">${s.t.slice(0,5)}</div><div class="grow"><div>${CLASSES[s.k].name}</div><div class="mute">${s.room}</div></div><div><span class="num">${s.taken}/${CLASSES[s.k].cap}</span><div class="bar"><i style="width:${s.taken/CLASSES[s.k].cap*100}%"></i></div></div></div>`).join('')||'<div class="mute" style="padding:16px 0">Hôm nay không có buổi học.</div>'}
    </div></section>
  </div>`}

/* ---- Lịch học ---- */
function schedule(){
  return head('Lịch học','Tuần 09–15/11/2026 · lịch này hiện trên moriclass.com','<button class="btn pri" data-toast="Mở form tạo buổi học">+ Thêm buổi học</button>')+`
  <div class="week">${DAYS.map((d,i)=>{const ss=SESSIONS.filter(s=>s.day===i);
    return `<div class="day ${i===TODAY?'today':''}"><h3>${d}<b>${DATES[i]}</b></h3>${ss.length?ss.map(s=>`<div class="slot ${CLASSES[s.k].cls}"><b>${CLASSES[s.k].name}</b><span>${s.t} · ${s.room}</span><span class="num">${s.taken}/${CLASSES[s.k].cap} học viên</span></div>`).join(''):'<div class="empty">Không có buổi</div>'}</div>`}).join('')}</div>`}

/* ---- Đăng ký ---- */
function regs(){
  const list=filter==='all'?REGS:REGS.filter(r=>r.status===filter);
  const tab=(k,l)=>`<button class="tab" data-f="${k}" aria-pressed="${filter===k}">${l}${k==='all'?'':' '+count(k)}</button>`;
  return head('Đăng ký','Nhận tự động từ form trên moriclass.com. Bạn liên hệ tư vấn rồi xác nhận thủ công.')+`
  <div class="tabs">${tab('all','Tất cả')}${tab('new','Mới')}${tab('contacted','Đang tư vấn')}${tab('confirmed','Đã xác nhận')}${tab('cancelled','Đã hủy')}</div>
  <div class="card scroll"><table><thead><tr><th>Học viên</th><th>Workshop</th><th>Liên hệ ưu tiên</th><th>Đăng ký lúc</th><th>Trạng thái</th></tr></thead><tbody>
  ${list.map(r=>`<tr data-reg="${r.id}"><td><b style="font-weight:500">${r.name}</b><div class="mute mono">${fmtPhone(r.phone)}</div></td><td>${CLASSES[r.k].name}</td><td>${PREF[r.pref]}</td><td>${r.at}${r.status==='new'?'<div>'+waited(r)+'</div>':''}</td><td>${pill(r.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="mute">Không có đăng ký nào.</td></tr>'}
  </tbody></table></div>`}

function crow(label,val,kind,extra=''){return `<div class="crow ${kind}"><span class="lbl">${label}</span><span class="val">${val}</span>${extra}<button class="btn sm" data-copy="${val.replace(/<[^>]+>/g,'')}">Chép</button></div>`}
function openReg(id){
  const r=REGS.find(x=>x.id===id);const c=CLASSES[r.k];const s=SESSIONS[r.s];
  const stage=['new','contacted','confirmed'].indexOf(r.status);
  const acts=r.status==='new'?`<button class="btn" data-close>Đóng</button><button class="btn danger" data-set="${r.id}:cancelled">Hủy đăng ký</button><button class="btn pri" data-set="${r.id}:contacted">Đã liên hệ</button>`:
    r.status==='contacted'?`<button class="btn" data-close>Đóng</button><button class="btn danger" data-set="${r.id}:cancelled">Hủy đăng ký</button><button class="btn pri" data-set="${r.id}:confirmed">Xác nhận học viên</button>`:
    r.status==='confirmed'?`<button class="btn" data-close>Đóng</button><button class="btn" data-toast="Đã gửi email xác nhận kèm lịch học">Gửi email xác nhận</button>`:
    `<button class="btn" data-close>Đóng</button><button class="btn" data-set="${r.id}:contacted">Mở lại tư vấn</button>`;
  $('#layer').innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="Chi tiết đăng ký">
   <div><span class="mono mute">${r.id} · ${r.at}</span><h2>${r.name}</h2><div style="display:flex;gap:8px;align-items:center;margin-top:4px">${pill(r.status)}${r.status==='new'?waited(r):''}</div></div>
   ${r.status!=='cancelled'?'<div class="steps" aria-hidden="true"><i class="on"></i><i class="'+(stage>=1?'on':'')+'"></i><i class="'+(stage>=2?'on':'')+'"></i></div>':''}
   <dl class="kv"><dt>Workshop</dt><dd>${c.name}</dd><dt>Buổi muốn học</dt><dd>${DAYS[s.day]} ${DATES[s.day]}/11 · ${s.t}<div class="mute">${s.room} · còn ${c.cap-s.taken} chỗ</div></dd><dt>Học phí</dt><dd class="num">${c.price.toLocaleString('vi-VN')} ₫</dd></dl>
   ${r.msg?`<div class="quote">“${r.msg}”</div>`:''}
   <div class="contact"><h2 style="font-size:14px">Liên hệ học viên</h2>
    ${crow('Zalo',fmtPhone(r.phone),r.pref==='zalo'?'pref':'',`<a class="btn sm pri" href="${zalo(r)}" target="_blank" rel="noopener">Mở Zalo</a>`)}
    ${crow('SĐT',fmtPhone(r.phone),r.pref==='phone'?'pref':'')}
    ${crow('Email',r.email,r.pref==='email'?'pref':'')}
    <div class="mute">Viền cam là cách học viên muốn được liên hệ.</div></div>
   <div><h2 style="font-size:14px;margin-bottom:10px">Nhật ký tư vấn</h2>
    <ul class="log">${r.log.map(l=>`<li><time>${l.w}</time><span>${l.t}</span></li>`).join('')||'<li><span class="mute">Chưa có ghi chú.</span></li>'}</ul>
    <textarea id="note" placeholder="Ghi lại nội dung vừa tư vấn…" aria-label="Ghi chú tư vấn" style="margin-top:10px"></textarea>
    <button class="btn sm" style="margin-top:8px" data-note="${r.id}">Lưu ghi chú</button></div>
   <div class="acts">${acts}</div></aside>`}

/* ---- Kết nối ---- */
function connect(){
  return head('Kết nối','Cách đăng ký từ website đến tay bạn','<button class="btn" data-sim>Giả lập đăng ký mới</button>')+`
  <section class="card" style="margin-bottom:16px"><header><h2>Luồng xử lý</h2></header><div class="flow">
    <div class="step"><span class="pill info">Website</span><b>Học viên đăng ký</b><p>Điền form trên moriclass.com: workshop, buổi muốn học, cách muốn được liên hệ.</p></div>
    <div class="step"><span class="pill acc">App</span><b>Lưu và báo cho bạn</b><p>Đăng ký vào danh sách với trạng thái “Mới”, đồng thời gửi thông báo.</p></div>
    <div class="step"><span class="pill info">Bạn</span><b>Liên hệ tư vấn</b><p>Gọi, nhắn Zalo hoặc gửi email. Ghi lại nội dung tư vấn ngay trong app.</p></div>
    <div class="step"><span class="pill ok">Bạn</span><b>Xác nhận thủ công</b><p>Chốt xong thì bấm “Xác nhận học viên”. App tính vào chỗ của buổi học và gửi email xác nhận.</p></div>
  </div></section>
  <div class="grid cols">
    <section class="card"><header><h2>Nhận thông báo khi có đăng ký mới</h2></header><div class="body">
      <div class="sw"><label>Email tới phuonglh.dp@gmail.com<input type="checkbox" checked data-sw="Email"></label></div>
      <div class="sw"><label>Thông báo trên điện thoại và trình duyệt<input type="checkbox" checked data-sw="Thông báo đẩy"></label></div>
      <div class="sw"><label>Tin nhắn Zalo cho quản trị viên (cần Zalo OA)<input type="checkbox" data-sw="Zalo"></label></div>
      <div class="sw"><label>Nhắc lại nếu đăng ký mới quá 24 giờ chưa liên hệ<input type="checkbox" checked data-sw="Nhắc lại"></label></div>
    </div></section>
    <section class="card"><header><h2>Website moriclass.com</h2><span class="pill ok">Đang hoạt động</span></header><div class="body" style="padding-top:16px">
      <div class="field"><label>Địa chỉ nhận đăng ký</label><div class="in">https://app.moriclass.com/api/registrations</div></div>
      <div class="field"><label>Khóa bí mật</label><div class="in">••••••••••••••••••4f2a</div></div>
      <div class="mute">Đăng ký cuối nhận lúc 10:42 hôm nay.</div></div></section>
  </div>`}

/* ---- Sự kiện ---- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const NOW='Vừa xong';
function update(id,fn){REGS=REGS.map(r=>r.id===id?fn(r):r)}
function setStatus(id,st){
  const r=REGS.find(x=>x.id===id);
  update(id,x=>({...x,status:st,log:[...x.log,{w:NOW,t:{contacted:'Đã liên hệ học viên.',confirmed:'Xác nhận học viên.',cancelled:'Hủy đăng ký.'}[st]}]}));
  if(st==='confirmed')SESSIONS=SESSIONS.map((s,i)=>i===r.s?{...s,taken:s.taken+1}:s);
  render();openReg(id);
  toast({contacted:'Đã chuyển sang Đang tư vấn',confirmed:'Đã xác nhận học viên và giữ chỗ',cancelled:'Đã hủy đăng ký'}[st]);
}
document.addEventListener('click',e=>{
  const t=e.target;
  const reg=t.closest('[data-reg]');if(reg){openReg(reg.dataset.reg);return}
  const f=t.closest('[data-f]');if(f){filter=f.dataset.f;render();return}
  const st=t.closest('[data-set]');if(st){const [id,s]=st.dataset.set.split(':');setStatus(id,s);return}
  const nt=t.closest('[data-note]');if(nt){const v=$('#note').value.trim();if(!v){toast('Chưa nhập nội dung ghi chú');return}update(nt.dataset.note,r=>({...r,log:[...r.log,{w:NOW,t:v}]}));openReg(nt.dataset.note);toast('Đã lưu ghi chú');return}
  const cp=t.closest('[data-copy]');if(cp){const v=cp.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Đã chép '+v),()=>toast('Không chép được, hãy chọn và chép thủ công'));return}
  const ts=t.closest('[data-toast]');if(ts){toast(ts.dataset.toast);return}
  if(t.closest('[data-sim]')){const id='DK0'+(422+REGS.length-7);REGS=[{id,name:'Hoàng Thảo Nguyên',phone:'0971663208',email:'thaonguyen@mail.com',k:'A',s:1,at:'Vừa xong',age:0,pref:'zalo',msg:'Mình muốn đăng ký cho cả bạn cùng lớp, có ưu đãi nhóm không?',status:'new',log:[]},...REGS];render();toast('Đăng ký mới từ website: Hoàng Thảo Nguyên');return}
  if(t.closest('[data-close]'))$('#layer').innerHTML=''});
document.addEventListener('change',e=>{const s=e.target.closest('[data-sw]');if(s)toast(s.dataset.sw+(s.checked?': đã bật':': đã tắt'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#layer').innerHTML=''});
$('#theme').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'});
addEventListener('hashchange',()=>{$('#layer').innerHTML='';render()});
render();
</script>
